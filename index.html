<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #123d2b 0%, #06150f 35%, #020504 75%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.profile {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #28e889;
  box-shadow:
    0 0 15px #28e889,
    0 0 45px rgba(40, 232, 137, 0.35);
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 1px;
}

.subtitle {
  margin: 10px 0 28px;
  color: #b7c8c0;
  font-size: 15px;
}

.link {
  display: block;
  text-decoration: none;
  color: white;
  background: rgba(15, 27, 22, 0.9);
  border: 1px solid rgba(40, 232, 137, 0.35);
  border-radius: 15px;
  padding: 17px;
  margin: 14px 0;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 0 15px rgba(40, 232, 137, 0.08);
  transition: 0.2s;
}

.link:hover {
  transform: scale(1.02);
  border-color: #28e889;
  box-shadow: 0 0 20px rgba(40, 232, 137, 0.25);
}

.footer {
  margin-top: 28px;
  color: #718078;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

  <img class="profile" src="martin.png" alt="Martin">

  <h1>Martin</h1>
  <div class="subtitle">Follow me & connect 👇</div>

  <a class="link" href="https://www.tiktok.com/@martin.19" target="_blank">
    🎵 TikTok — martin.19
  </a>

  <a class="link" href="https://www.instagram.com/1.mrtin" target="_blank">
    📸 Instagram — 1.mrtin
  </a>

  <a class="link" href="https://paypal.me/MART3N77" target="_blank">
    💳 PayPal — MART3N77
  </a>

  <div class="footer">martin.19 • Martin</div>

</div>

</body>
</html>
