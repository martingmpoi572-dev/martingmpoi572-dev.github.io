<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #063d28 0%, #021b12 35%, #000 75%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 20px;
}

.container {
  width: 100%;
  max-width: 530px;
  text-align: center;
}

.profile {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #00ff88;
  box-shadow:
    0 0 15px #00ff88,
    0 0 35px rgba(0,255,136,0.5);
}

h1 {
  margin: 20px 0 8px;
  font-size: 42px;
}

.subtitle {
  color: #c8c8c8;
  font-size: 18px;
  margin-bottom: 30px;
}

.link {
  display: block;
  text-decoration: none;
  color: white;
  background: rgba(2, 30, 20, 0.75);
  border: 1px solid rgba(0,255,136,0.35);
  border-radius: 18px;
  padding: 22px;
  margin: 16px 0;
  font-size: 20px;
  font-weight: bold;
  transition: 0.2s;
}

.link:hover {
  transform: scale(1.02);
  border-color: #00ff88;
  box-shadow: 0 0 20px rgba(0,255,136,0.3);
}

.footer {
  margin-top: 35px;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <img class="profile" src="IMG_6777.jpeg" alt="Martin">

  </a>
